[project]
name = "llm-resume-evaluator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "premkishan1215-maker", email = "premkishan1215@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.14.2",
